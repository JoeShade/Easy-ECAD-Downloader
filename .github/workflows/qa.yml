# Run optional QA harness checks when a developer manually requests them.
# This workflow uses offline fixtures; live Chrome/KiCad runs remain local.
name: Optional QA harness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-offline:
    name: Offline QA harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install JavaScript dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Install renderer image support
        run: python -m pip install -r tests/headless-qa/requirements.txt -r tests/headless-qa/requirements-lint.txt

      - name: Lint QA support code
        run: npm run qa:lint

      - name: Run offline harness regressions
        run: npm run qa:smoke
