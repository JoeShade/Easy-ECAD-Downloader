# Validate extension changes on pushes and pull requests.
# Optional QA harness checks have a separate manually triggered workflow.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.19.0
          - 22.13.0
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Run validation
        run: npm run validate

  package:
    name: Verify extension package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pinned packaging linter
        run: python -m pip install -r tests/headless-qa/requirements-lint.txt
      - name: Lint and test the packager, then build the tracked extension
        run: |
          python -m ruff check scripts tests/test_package_extension.py
          python -m unittest discover -s tests -p test_package_extension.py
          python scripts/package_extension.py
