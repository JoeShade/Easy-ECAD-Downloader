# Validate extension changes and the offline browser/KiCad QA support code.
# Native Chrome/KiCad exercises remain local; CI runs deterministic regressions.
name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20.19.0
          - 22.13.0
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run validation
        run: npm run validate

  qa-offline:
    name: Offline QA harness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install JavaScript dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: Install renderer image support
        run: python -m pip install -r tests/headless-qa/requirements.txt -r tests/headless-qa/requirements-lint.txt

      - name: Lint QA support code
        run: npm run qa:lint

      - name: Run offline harness regressions
        run: npm run qa:smoke
